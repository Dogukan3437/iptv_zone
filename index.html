<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IPTV ZONE</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, system-ui, Roboto, Arial, sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  min-height: 100vh;
  color: #fff;
  padding: 15px;
  padding-top: 20px;
}
.container {
  max-width: 500px;
  margin: 0 auto;
}
.logo {
  text-align: center;
  margin-bottom: 20px;
}
.logo h1 {
  font-size: 24px;
  background: linear-gradient(90deg, #667eea, #764ba2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.logo span {
  font-size: 11px;
  color: #888;
  letter-spacing: 3px;
}
.tabs {
  display: flex;
  background: #0f0f23;
  border-radius: 12px;
  padding: 5px;
  margin-bottom: 20px;
  gap: 5px;
}
.tab {
  flex: 1;
  padding: 12px 8px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: #888;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.tab.active {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
}
.form-group {
  margin-bottom: 15px;
}
.form-group label {
  display: block;
  font-size: 12px;
  color: #888;
  margin-bottom: 6px;
  font-weight: 500;
}
.form-group input, .form-group select {
  width: 100%;
  padding: 14px;
  border: 1px solid #333;
  border-radius: 10px;
  background: #0f0f23;
  color: #fff;
  font-size: 15px;
  outline: none;
}
.form-group input:focus {
  border-color: #667eea;
}
.form-group input::placeholder {
  color: #555;
}
.btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
}
.btn:active {
  opacity: 0.9;
  transform: scale(0.99);
}
.btn-secondary {
  background: #0f0f23;
  border: 1px solid #333;
  margin-top: 10px;
}
.profiles {
  margin-top: 25px;
}
.profiles h3 {
  font-size: 11px;
  color: #666;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.profile-empty {
  text-align: center;
  padding: 20px;
  color: #555;
  border: 1px dashed #333;
  border-radius: 10px;
  font-size: 14px;
}
.note {
  margin-top: 20px;
  padding: 12px;
  background: #0f0f23;
  border-radius: 10px;
  font-size: 12px;
  color: #888;
  line-height: 1.6;
}
.hidden { display: none !important; }

/* Player styles */
.player-container {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: #000;
  z-index: 1000;
}
.player-header {
  display: flex;
  align-items: center;
  padding: 15px;
  background: linear-gradient(180deg, rgba(0,0,0,0.8), transparent);
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 10;
}
.back-btn {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
}
.player-title {
  margin-left: 15px;
  font-size: 16px;
}
#video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.channel-list {
  margin-top: 20px;
}
.channel-item {
  display: flex;
  align-items: center;
  padding: 12px;
  background: #0f0f23;
  border-radius: 10px;
  margin-bottom: 8px;
  cursor: pointer;
}
.channel-item:active {
  background: #1a1a3e;
}
.channel-icon {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 12px;
  font-size: 18px;
}
.channel-name {
  font-size: 14px;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="container" id="loginScreen">
  <div class="logo">
    <h1>IPTV ZONE</h1>
    <span>PLAYER</span>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('xtream')">Xtream</button>
    <button class="tab" onclick="switchTab('mac')">MAC</button>
    <button class="tab" onclick="switchTab('local')">Yerel</button>
  </div>

  <div id="xtream-form">
    <div class="form-group">
      <label>Profil adı</label>
      <input type="text" id="profile-name" placeholder="Ev IPTV">
    </div>
    <div class="form-group">
      <label>Sunucu adresi</label>
      <input type="url" id="server" placeholder="http://example.com:8080">
    </div>
    <div class="form-group">
      <label>Kullanıcı adı</label>
      <input type="text" id="username" placeholder="kullanici">
    </div>
    <div class="form-group">
      <label>Şifre</label>
      <input type="password" id="password" placeholder="••••••">
    </div>
    <div class="form-group">
      <label>Yayın formatı</label>
      <select id="format">
        <option value="m3u8">HLS (.m3u8) - Tarayıcıda uyumlu</option>
        <option value="ts">MPEG-TS (.ts)</option>
      </select>
    </div>
  </div>

  <div id="mac-form" class="hidden">
    <div class="form-group">
      <label>Profil adı</label>
      <input type="text" id="mac-profile" placeholder="Ev IPTV">
    </div>
    <div class="form-group">
      <label>Portal adresi</label>
      <input type="url" id="portal" placeholder="http://example.com:8080/c/">
    </div>
    <div class="form-group">
      <label>MAC adresi</label>
      <input type="text" id="mac" placeholder="00:1A:79:XX:XX:XX">
    </div>
  </div>

  <div id="local-form" class="hidden">
    <div class="note">
      📂 <b>Yerel Kanallar:</b> M3U link veya dosya ile kendi kanal listeni ekle.
    </div>
    <div class="form-group" style="margin-top:15px">
      <label>M3U Link veya URL</label>
      <input type="url" id="m3u-url" placeholder="http://example.com/playlist.m3u">
    </div>
  </div>

  <button class="btn" onclick="connect()">Bağlan</button>
  <button class="btn btn-secondary" onclick="showLocalChannels()">📂 Yerel Kanallarım</button>

  <div class="profiles">
    <h3>KAYITLI PROFİLLER</h3>
    <div id="profile-list">
      <div class="profile-empty">Henüz kayıtlı profil yok</div>
    </div>
  </div>

  <div class="note">
    💡 <b>İpucu:</b> Bu oynatıcı yayınları doğrudan sunucudan çeker. CORS izni olan sunucular çalışır.
  </div>
</div>

<div class="player-container hidden" id="playerScreen">
  <div class="player-header">
    <button class="back-btn" onclick="closePlayer()">←</button>
    <div class="player-title" id="playerTitle">Kanal</div>
  </div>
  <video id="video" controls autoplay playsinline></video>
</div>

<div class="container hidden" id="channelScreen">
  <div style="display:flex;align-items:center;margin-bottom:20px">
    <button class="back-btn" onclick="backToLogin()" style="margin-right:15px">←</button>
    <h2 style="font-size:18px">Kanallar</h2>
  </div>
  <div class="channel-list" id="channelList"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
let currentTab = 'xtream';
let profiles = JSON.parse(localStorage.getItem('iptv_profiles') || '[]');
let hls = null;

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  document.getElementById('xtream-form').classList.toggle('hidden', tab !== 'xtream');
  document.getElementById('mac-form').classList.toggle('hidden', tab !== 'mac');
  document.getElementById('local-form').classList.toggle('hidden', tab !== 'local');
}

function connect() {
  if (currentTab === 'xtream') {
    const server = document.getElementById('server').value.trim().replace(/\/$/, '');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const format = document.getElementById('format').value;

    if (!server || !username || !password) {
      alert('Lütfen tüm alanları doldurun');
      return;
    }

    // Test connection and get channels
    fetchXtreamChannels(server, username, password, format);
  } else if (currentTab === 'local') {
    const m3uUrl = document.getElementById('m3u-url').value.trim();
    if (m3uUrl) {
      fetchM3UChannels(m3uUrl);
    }
  } else {
    alert('MAC portal desteği yakında eklenecek');
  }
}

async function fetchXtreamChannels(server, username, password, format) {
  try {
    const url = server + '/player_api.php?username=' + username + '&password=' + password + '&action=get_live_streams';
    const response = await fetch(url);
    const channels = await response.json();

    if (channels && channels.length > 0) {
      showChannels(channels.map(ch => ({
        name: ch.name,
        logo: ch.stream_icon,
        url: server + '/live/' + username + '/' + password + '/' + ch.stream_id + '.' + format
      })));
    } else {
      alert('Kanal bulunamadı veya giriş bilgileri hatalı');
    }
  } catch (e) {
    alert('Bağlantı hatası: ' + e.message);
  }
}

async function fetchM3UChannels(url) {
  try {
    const response = await fetch(url);
    const text = await response.text();
    const channels = parseM3U(text);
    if (channels.length > 0) {
      showChannels(channels);
    } else {
      alert('M3U dosyasında kanal bulunamadı');
    }
  } catch (e) {
    alert('M3U yüklenemedi: ' + e.message);
  }
}

function parseM3U(text) {
  const lines = text.split('\n');
  const channels = [];
  let currentChannel = null;

  for (let line of lines) {
    line = line.trim();
    if (line.startsWith('#EXTINF:')) {
      const nameMatch = line.match(/,(.+)$/);
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      currentChannel = {
        name: nameMatch ? nameMatch[1].trim() : 'Kanal',
        logo: logoMatch ? logoMatch[1] : null
      };
    } else if (line && !line.startsWith('#') && currentChannel) {
      currentChannel.url = line;
      channels.push(currentChannel);
      currentChannel = null;
    }
  }
  return channels;
}

function showChannels(channels) {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('channelScreen').classList.remove('hidden');

  const list = document.getElementById('channelList');
  list.innerHTML = channels.map((ch, i) => `
    <div class="channel-item" onclick="playChannel(${i})">
      <div class="channel-icon">${ch.logo ? '<img src="'+ch.logo+'" style="width:100%;height:100%;object-fit:cover;border-radius:8px" onerror="this.parentElement.innerHTML=\'📺\'">' : '📺'}</div>
      <div class="channel-name">${ch.name}</div>
    </div>
  `).join('');

  window.currentChannels = channels;
}

function playChannel(index) {
  const channel = window.currentChannels[index];
  document.getElementById('channelScreen').classList.add('hidden');
  document.getElementById('playerScreen').classList.remove('hidden');
  document.getElementById('playerTitle').textContent = channel.name;

  const video = document.getElementById('video');

  if (hls) {
    hls.destroy();
    hls = null;
  }

  if (channel.url.includes('.m3u8') && Hls.isSupported()) {
    hls = new Hls();
    hls.loadSource(channel.url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
  } else {
    video.src = channel.url;
    video.play();
  }
}

function closePlayer() {
  const video = document.getElementById('video');
  video.pause();
  video.src = '';
  if (hls) {
    hls.destroy();
    hls = null;
  }
  document.getElementById('playerScreen').classList.add('hidden');
  document.getElementById('channelScreen').classList.remove('hidden');
}

function backToLogin() {
  document.getElementById('channelScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

function showLocalChannels() {
  alert('Yerel kanal yönetimi yakında eklenecek');
}

// Load saved profiles
function loadProfiles() {
  const list = document.getElementById('profile-list');
  if (profiles.length === 0) {
    list.innerHTML = '<div class="profile-empty">Henüz kayıtlı profil yok</div>';
  } else {
    list.innerHTML = profiles.map(p => `
      <div class="channel-item">
        <div class="channel-icon">👤</div>
        <div class="channel-name">${p.name}</div>
      </div>
    `).join('');
  }
}

loadProfiles();
</script>
</body>
</html>
