name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK parcalari
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: APK olustur
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/34.0.0"
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"

          # dosyalari bul (depoda nerede olursa olsun)
          JAVA=$(find . -name MainActivity.java -not -path './b/*' | head -1)
          if [ -f app/src/main/assets/index.html ]; then HTML=app/src/main/assets/index.html; else HTML=index.html; fi
          echo "Java: $JAVA   HTML: $HTML"
          test -f "$JAVA"; test -f "$HTML"; test -f iptvzone.keystore

          rm -rf b; mkdir -p b/assets b/obj b/dex
          cp "$HTML" b/assets/index.html

          cat > b/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.iptvzone.player">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="IPTV ZONE"
                android:usesCleartextTraffic="true"
                android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.Black.NoTitleBar">
              <activity android:name=".MainActivity"
                  android:exported="true"
                  android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|keyboardHidden|keyboard|navigation|uiMode">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          "$BT/aapt2" link -o b/taban.apk -I "$JAR" --manifest b/AndroidManifest.xml -A b/assets \
              --min-sdk-version 21 --target-sdk-version 34 \
              --version-code ${{ github.run_number }} --version-name "1.${{ github.run_number }}"

          javac -source 8 -target 8 -nowarn -bootclasspath "$JAR" -d b/obj "$JAVA"
          "$BT/d8" --min-api 21 --lib "$JAR" --output b/dex $(find b/obj -name '*.class')

          cp b/taban.apk b/imzasiz.apk
          (cd b/dex && zip -q -j ../imzasiz.apk classes.dex)
          "$BT/zipalign" -f -p 4 b/imzasiz.apk b/hizali.apk
          "$BT/apksigner" sign --ks iptvzone.keystore --ks-pass pass:iptvzone123 --key-pass pass:iptvzone123 \
              --ks-key-alias iptvzone --out IPTV_ZONE.apk b/hizali.apk
          "$BT/apksigner" verify IPTV_ZONE.apk
          ls -la IPTV_ZONE.apk

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV_ZONE
          path: IPTV_ZONE.apk

      - name: Sabit indirme linkine koy (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son -y --cleanup-tag || true
          gh release create son IPTV_ZONE.apk --title "IPTV ZONE son sürüm (1.${{ github.run_number }})" --notes "Otomatik derlendi." --target "${{ github.sha }}"
